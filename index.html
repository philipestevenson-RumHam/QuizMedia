<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Answer Bank</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
    }

    .option {
      padding: 12px;
      background: white;
      border: 2px solid #ccc;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .option.selected {
      background-color: #007bff;
      color: white;
      border-color: #0056b3;
    }

    .option.yellow {
      background-color: yellow !important;
      color: black !important;
      border-color: goldenrod !important;
    }
  </style>
</head>
<body>

  <h1>Answer Bank</h1>
  <div class="grid" id="grid"></div>

  <script>
    const customOptions = [
      "This", "would", "be", "easier", "than",
      "pen", "and", "paper", ".", "Just",
      "adjust", "this", "bit", "and", "host",
      "on", "a", "free", "site", "like",
      "gethub", "Double Click a Correct", "Click to Select", "Click to Undo", "Option Y",
      "Option Z", "Option AA", "Option AB", "Option AC", "Option AD",
      "Option AE", "Option AF", "Option AG", "Option AH", "Option AI",
      "Option AJ", "Option AK", "Option AL", "Option AM", "Option AN",
      "Option AO", "Option AP", "Option AQ", "Option AR", "Option AS",
      "Option AT", "Option AU", "Option AV", "Option AW", "Option AX",
      "Option AY", "Option AZ", "Option BA", "Option BB", "Option BC",
      "Option BD", "Option BE", "Option BF", "Option BG", "Option BH",
      "Option BI", "Option BJ", "Option BK", "Option BL", "Option BM",
      "Option BN", "Option BO", "Option BP", "Option BQ", "Option BR",
      "Option BS", "Option BT", "Option BU", "Option BV", "Option BW",
      "Option BX", "Option BY", "Option BZ", "Option CA", "Option CB"
    ];

    const grid = document.getElementById('grid');

    customOptions.forEach(text => {
      const btn = document.createElement('div');
      btn.className = 'option';
      btn.textContent = text;

      btn.addEventListener('click', () => {
        if (btn.classList.contains('yellow')) {
          btn.classList.remove('yellow');
        } else {
          btn.classList.toggle('selected');
        }
      });

      btn.addEventListener('dblclick', () => {
        btn.classList.remove('selected');
        btn.classList.toggle('yellow');
      });

      grid.appendChild(btn);
    });
  </script>

</body>
</html>
